<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Builder</title>
    <link rel="stylesheet" href="/assets/main.css" />
</head>
<body>
    <div class="container mt-4">
        <h1>Prompt Builder</h1>
        
        <!-- Template Selector versin  2 -->
        <div class="card mb-3">
            <div class="card-body">
                <h5>Select Templates</h5>
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="domain" placeholder="Domain" value="yourdomain.com">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="folder" placeholder="Folder path" value="/components/">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" id="loadTemplates">Load Templates</button>
                    </div>
                </div>
                <select class="form-select mt-2" id="templateSelect" size="5" disabled>
                    <option>Click "Load Templates" first</option>
                </select>
                <button class="btn btn-sm btn-success mt-2" id="addTemplate">Add Selected Template</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="mb-3">
            <button class="btn btn-secondary" id="addManual">Add Manual Text</button>
            <button class="btn btn-secondary" id="addLink">Add Link</button>
            <button class="btn btn-danger" id="clearAll">Clear All</button>
        </div>

        <!-- Prompt Blocks -->
        <div id="blocks" class="mb-3"></div>

        <!-- Actions -->
        <div class="mb-3">
            <button class="btn btn-primary" id="preview">Preview</button>
            <button class="btn btn-success" id="copy">Copy to Clipboard</button>
        </div>

        <!-- Preview Area -->
        <div id="previewArea" class="card d-none">
            <div class="card-body">
                <h5>Preview</h5>
                <pre id="previewContent" class="bg-light p-3" style="max-height: 400px; overflow-y: auto;"></pre>
            </div>
        </div>
    </div>

    <script>
        let blocks = [];
        let blockId = 0;

        // Load templates from sitemap.xml
        document.getElementById('loadTemplates').onclick = async () => {
            const domain = document.getElementById('domain').value.trim();
            const folder = document.getElementById('folder').value.trim();
            const select = document.getElementById('templateSelect');
            
            select.innerHTML = '<option>Loading...</option>';
            select.disabled = false;

            try {
                // Fetch sitemap.xml
                const sitemapUrl = `https://${domain}/sitemap.xml`;
                const response = await fetch(sitemapUrl);
                const xmlText = await response.text();
                
                // Parse XML
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                // Get all <loc> elements
                const locs = xmlDoc.getElementsByTagName('loc');
                const templates = [];
                
                // Filter URLs that contain the folder path
                for (let loc of locs) {
                    const url = loc.textContent;
                    if (url.includes(folder)) {
                        // Extract filename from URL
                        const parts = url.split('/');
                        const filename = parts[parts.length - 1];
                        if (filename && filename.endsWith('.html')) {
                            templates.push({
                                filename: filename,
                                url: url
                            });
                        }
                    }
                }
                
                // Populate dropdown
                select.innerHTML = '';
                if (templates.length === 0) {
                    select.innerHTML = '<option>No templates found</option>';
                } else {
                    templates.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t.url;
                        option.textContent = t.filename;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                select.innerHTML = '<option>Error loading sitemap</option>';
                alert('Failed to load sitemap: ' + error.message);
            }
        };

        // Add selected template
        document.getElementById('addTemplate').onclick = async () => {
            const select = document.getElementById('templateSelect');
            const url = select.value;
            const filename = select.options[select.selectedIndex].text;
            
            if (!url) return;

            try {
                const response = await fetch(url);
                const content = await response.text();
                
                addBlock({
                    type: 'template',
                    label: filename,
                    content: content,
                    editable: false
                });
            } catch (error) {
                alert('Failed to fetch template: ' + error.message);
            }
        };

        // Add manual text
        document.getElementById('addManual').onclick = () => {
            const content = prompt('Enter text:');
            if (content) {
                addBlock({
                    type: 'manual',
                    label: 'Manual Text',
                    content: content,
                    editable: true
                });
            }
        };

        // Add link
        document.getElementById('addLink').onclick = () => {
            const url = prompt('Enter URL:');
            if (url) {
                addBlock({
                    type: 'link',
                    label: 'Link',
                    content: url,
                    editable: false
                });
            }
        };

        // Clear all blocks
        document.getElementById('clearAll').onclick = () => {
            if (confirm('Clear all blocks?')) {
                blocks = [];
                render();
            }
        };

        // Preview
        document.getElementById('preview').onclick = () => {
            const full = blocks.map(b => `=== ${b.type.toUpperCase()}: ${b.label} ===\n${b.content}\n`).join('\n');
            document.getElementById('previewContent').textContent = full;
            document.getElementById('previewArea').classList.remove('d-none');
        };

        // Copy to clipboard
        document.getElementById('copy').onclick = () => {
            const full = blocks.map(b => b.content).join('\n\n');
            navigator.clipboard.writeText(full).then(() => {
                alert('Copied!');
            });
        };

        // Add block
        function addBlock(data) {
            blocks.push({ id: blockId++, ...data });
            render();
        }

        // Render blocks
        function render() {
            const container = document.getElementById('blocks');
            if (blocks.length === 0) {
                container.innerHTML = '<p class="text-muted">No blocks yet</p>';
                return;
            }

            container.innerHTML = blocks.map((b, i) => `
                <div class="card mb-2">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <span class="badge bg-${b.type === 'template' ? 'success' : b.type === 'manual' ? 'warning' : 'info'}">${b.type}</span>
                                <span class="ms-2">${b.label}</span>
                            </div>
                            <div>
                                ${i > 0 ? `<button class="btn btn-sm btn-outline-secondary" onclick="move(${i}, ${i-1})">↑</button>` : ''}
                                ${i < blocks.length - 1 ? `<button class="btn btn-sm btn-outline-secondary" onclick="move(${i}, ${i+1})">↓</button>` : ''}
                                <button class="btn btn-sm btn-outline-danger" onclick="remove(${i})">×</button>
                            </div>
                        </div>
                        ${b.editable 
                            ? `<textarea class="form-control" rows="3" onchange="blocks[${i}].content=this.value">${b.content}</textarea>`
                            : `<pre class="bg-light p-2 mb-0" style="max-height: 150px; overflow-y: auto;">${b.content}</pre>`
                        }
                    </div>
                </div>
            `).join('');
        }

        // Move block
        function move(from, to) {
            const [block] = blocks.splice(from, 1);
            blocks.splice(to, 0, block);
            render();
        }

        // Remove block
        function remove(i) {
            blocks.splice(i, 1);
            render();
        }

        // Initial render
        render();
    </script>
</body>
</html>
