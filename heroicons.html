            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" style="width: 48px; height: 48px;">
                <defs>
                    <linearGradient id="patriotic-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
