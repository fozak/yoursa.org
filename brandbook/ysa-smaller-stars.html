<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: 'Roboto', "Helvetica Neue", Arial, sans-serif;
    /* Get rid of that awful negative spacing. Let it breathe! */
    letter-spacing: -0.1em; 
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: 40px;
    background: #f9f9f9;
  }

  .ysa {
    font-size: 48px;
    font-weight: bold;
    /* This ensures we can align items relative to the line height */
    line-height: 1; 
  }

  /* Define the star class */
  .star {
    /* 1. Make it smaller. It is an ornament, not a letter. */
    font-size: 70%; 
    
    /* 2. Vertical Alignment. 
       'Middle' gets you close, but often looks too low for All-Caps. 
       We use position relative to nudge it perfectly into the center. */
    vertical-align: middle;
    position: relative;
    top: -4px; /* was - 3px A slight lift to hit the optical center of the 'S' */

    /* 3. Give it breathing room on the sides */
    margin: 0 0.15em;
  }

  .ysa2 { color: #0B1E37; }
</style>
</head>
<body>

  <!-- You must wrap the stars in spans to control them -->
  <div class="ysa ysa2">
    Y<span class="star">★</span>S<span class="star">★</span>A
  </div>

</body>
</html>
