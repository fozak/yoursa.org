<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Mentoring Selector</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f6f7f9;
    padding: 20px;
  }
  h2 { margin-bottom: 10px; }

  .controls {
    background: #fff;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .tags label {
    margin-right: 12px;
    font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  .card img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 8px;
  }

  .badge {
    display: inline-block;
    background: #e9eefc;
    color: #334;
    padding: 3px 8px;
    margin: 2px;
    border-radius: 6px;
    font-size: 12px;
  }
</style>
</head>

<body>

<h2>🎓 Student Mentoring Selection</h2>

<div class="controls">
  <div class="tags">
    <strong>Filter by tags:</strong><br><br>
    <label><input type="checkbox" value="cs"> CS</label>
    <label><input type="checkbox" value="internship"> Internship</label>
    <label><input type="checkbox" value="leadership"> Leadership</label>
    <label><input type="checkbox" value="research"> Research</label>
  </div>

  <br>

  <label>
    <strong>Sort by:</strong>
    <select id="sort">
      <option value="score">Mentor Score</option>
      <option value="gradYear">Graduation Year</option>
      <option value="name">Name</option>
    </select>
  </label>
</div>

<div id="cards" class="grid"></div>

<script>
const students = [
  {
    name: "Olivia Ma",
    major: "Computer Science",
    gradYear: 2026,
    tags: ["cs", "internship", "leadership"],
    score: 4.7,
    photo: "https://via.placeholder.com/150"
  },
  {
    name: "Jackie Kiel",
    major: "Physiology",
    gradYear: 2026,
    tags: ["research"],
    score: 4.2,
    photo: "https://via.placeholder.com/150"
  },
  {
    name: "Sean Tomany",
    major: "Data Science",
    gradYear: 2026,
    tags: ["cs", "internship"],
    score: 4.5,
    photo: "https://via.placeholder.com/150"
  }
];

const cardsEl = document.getElementById("cards");
const tagInputs = document.querySelectorAll(".tags input");
const sortSelect = document.getElementById("sort");

function render(list) {
  cardsEl.innerHTML = "";
  list.forEach(s => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${s.photo}" alt="${s.name}">
      <h3>${s.name}</h3>
      <p>${s.major}</p>
      <p>Class of ${s.gradYear}</p>
      <p><strong>Score:</strong> ${s.score}</p>
      <div>
        ${s.tags.map(t => `<span class="badge">${t}</span>`).join("")}
      </div>
    `;
    cardsEl.appendChild(card);
  });
}

function update() {
  const selectedTags = [...tagInputs]
    .filter(i => i.checked)
    .map(i => i.value);

  let filtered = students.filter(s =>
    selectedTags.length === 0 ||
    selectedTags.every(t => s.tags.includes(t))
  );

  const sortBy = sortSelect.value;
  filtered.sort((a, b) =>
    typeof a[sortBy] === "string"
      ? a[sortBy].localeCompare(b[sortBy])
      : b[sortBy] - a[sortBy]
  );

  render(filtered);
}

tagInputs.forEach(i => i.addEventListener("change", update));
sortSelect.addEventListener("change", update);

// Initial render
render(students);
</script>

</body>
</html>
